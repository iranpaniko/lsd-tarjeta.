<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f1a">
  <title>LSD | Loyal Shine Detailing</title>
  <style>
    :root{--bg:#080d18;--panel:#101a2b;--gold:#d4af37;--blue:#1d4f91;--white:#f7f8fb;--muted:#b8c2d3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0%,#17345b 0,#080d18 55%);font-family:Arial,Helvetica,sans-serif;color:var(--white)}
    .card{width:min(100%,430px);padding:34px 25px 28px;border:1px solid rgba(212,175,55,.55);border-radius:25px;background:linear-gradient(155deg,rgba(19,34,56,.98),rgba(8,13,24,.98));box-shadow:0 22px 65px #0009;text-align:center}
    .mark{width:92px;height:92px;margin:0 auto 18px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:25px;font-weight:900;letter-spacing:2px;box-shadow:0 0 28px #d4af3728}
    .eyebrow{margin:0 0 8px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:4px}
    h1{margin:0;font-size:29px;letter-spacing:1px}
    .tagline{margin:11px 0 25px;color:var(--muted);font-size:15px}
    .line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0}
    h2{font-size:13px;letter-spacing:2px;color:var(--gold);margin:0 0 14px}
    .services{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:25px}
    .services span{padding:9px 12px;border:1px solid #ffffff24;border-radius:30px;background:#ffffff09;font-size:13px;color:#e5eaf2}
    .cta{display:block;padding:16px 18px;border-radius:13px;background:#20c767;color:#06140b;text-decoration:none;font-size:16px;font-weight:800;box-shadow:0 8px 24px #20c76730}
    .cta:active{transform:scale(.99)}
    .number{margin:12px 0 0;color:var(--muted);font-size:13px}
    footer{margin-top:25px;color:#8492a8;font-size:11px;letter-spacing:1px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-label="LSD">LSD</div>
    <p class="eyebrow">LOYAL SHINE</p>
    <h1>DETAILING</h1>
    <p class="tagline">Brillo que impone respeto.</p>
    <div class="line"></div>
    <h2>CUIDAMOS CADA DETALLE</h2>
    <div class="services">
      <span>Lavado exterior</span>
      <span>Limpieza interior</span>
      <span>Aspirado</span>
      <span>Detallado automotriz</span>
    </div>
    <a class="cta" href="https://wa.me/529848066658?text=Hola%20LSD%2C%20quiero%20cotizar%20un%20servicio%20para%20mi%20veh%C3%ADculo." target="_blank" rel="noopener">Cotiza por WhatsApp</a>
    <p class="number">WhatsApp: +52 722 339 7782</p>
    <footer>PLAYA DEL CARMEN · QUINTANA ROO</footer>
  </main>
</body>
</html>
